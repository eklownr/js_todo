<!DOCTYPE html>
<html>
    <head>
        <title>DOM</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            .subscribe-button {
                background-color: forestgreen;
                color: white;
                border: none;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                margin-bottom: 30px;
            }
            .is-subscibed {
                background-color: lightgray;
                color: black;
            }
            .order-amount {
                font-size: 18px;
                padding: 5px;
                margin-bottom: 10px;
            }
            .calculate-button {
                background-color: forestgreen;
                color: white;
                border: none;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                margin-bottom: 30px;
            }
        </style>
    </head>
    <body>
        <p>Youtube subscribe button</p>
        <button onclick="subscribe();" class="js-subscribe-button subscribe-button">Subscribe</button>
       
        <p>Rock, paper, scissors</p>
        <p><a href="rock_scissors_paper.html">Play!</a></p>
       
        <h3>Amazon Shiping Calculator</h3>
        <p> under $40 = +$10 shipping. </p>
        <p> over $40 = free shipping. </p>
        <input type="number" placeholder="Cost of order" class="js-order-amount order-amount">
        <button onclick="calculateTotalCost()" class="js-calculate-button calculate-button">Calculate</button>
        <p class="js-shipping-cost"></p>
       
       <script>
            function subscribe() {
                const buttonElement = document.querySelector('.js-subscribe-button');
                if (buttonElement.innerText === 'Subscribe') {
                    buttonElement.innerHTML = 'Subscribed';
                    buttonElement.classList.add('is-subscibed');
                } else {
                    buttonElement.innerHTML = 'Subscribe';
                    buttonElement.classList.remove('is-subscibed');
                }
            }
            // Calculate shipping and show total cost
            function calculateTotalCost() {
                const orderAmountInput = document.querySelector('.js-order-amount');
                const totalCostElement = document.querySelector('.js-shipping-cost');
                const orderAmount = parseInt(orderAmountInput.value, 10);
                const shippingCost = orderAmount < 40 ? orderAmount + 10 : orderAmount;
                totalCostElement.textContent = shippingCost.toLocaleString('en-US', {
                    style: 'currency',
                    currency: 'USD'
                });
            }
        </script>
    </body>
</html>
