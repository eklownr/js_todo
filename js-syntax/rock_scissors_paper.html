<!DOCTYPE html>
<html>
  <head>
    <title>functions</title>
    <style>
      body {
        background-color: black;
        color: beige;
        margin: 40px;
      }
      .move-button1 {
        background-color: red;
        border: 4px solid white;
        border-radius: 50px;
        margin: 10px;
        margin-left: 0px;
      }
      .move-button2 {
        background-color: green;
        border: 4px solid white;
        border-radius: 50px;
        margin: 10px;
      }
      .move-button3 {
        background-color: blue;
        border: 4px solid white;
        border-radius: 50px;
        margin: 10px;
      }
      .move-icon {
        height: 50px;
      }
      .move{
        font-size: 20px;
      }
      .result {
        font-size: 30px;
        margin-top: 50px;
      }
      .point {
        font-size: 30px;
      }
      .reset {
        background-color: red;
        border: 4px solid white;
        border-radius: 50px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Play rock, paper, scissors</h1>
    <button onclick="play('rock');" class="move-button1">
      <img src="images/rock.png" class="move-icon" alt="rock"></button>
    <button onclick="play('paper');" class="move-button2">
      <img src="images/paper.png" class="move-icon" alt="paper"> </button>
    <button onclick="play('scissors');" class="move-button3">
      <img src="images/scissors.png" class="move-icon" alt="scissors"></button>

    <p class="result js-result">How win?</p>
    <p class="js-move move"> <img src="images/scissors.png" class="move-icon" alt="scissors"></p>
    <p class="point js-point">Points: </p>

    <button onclick="resetPoint()"; class="reset" >Reset points</button>

    <script>
      // globals
      let playerPoint = 0;
      let computerPoint = 0;
      const pointElement = document.querySelector('.js-point');
      let showPoints = "";
    
      // play the game
      function play(playerMove) {
        const resultElement = document.querySelector('.js-result');
        const moveElement = document.querySelector('.js-move');
        computerMove = pickComputerMove();
        let res = "";

        if (playerMove === computerMove) {
          res = "Tie";
        } else if (
          playerMove === "rock" && computerMove === "scissors" ||
          playerMove === "scissors" && computerMove === "paper" ||
          playerMove === "paper" && computerMove === "rock") {
            res = "You win!";
            playerPoint ++;
        } else {
          res = "You lose!";
          computerPoint++;
        }

        showPoints = "You: " + playerPoint + " Comuter: " + computerPoint;
        resultElement.innerHTML = res;
        moveElement.innerHTML = `You:
          <img src="images/${playerMove}.png" class="move-icon" alt="rock">
          Computer:
          <img src="images/${computerMove}.png" class="move-icon" alt="scissors"> `;
          pointElement.innerHTML = showPoints;
      }

      // return computer move
      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';
        if (randomNumber >= 0 && randomNumber < 1/3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
          computerMove = 'scissors';
        }
        return computerMove;
      }

      function resetPoint() {
        playerPoint = 0;
        computerPoint = 0;
        showPoints = "You: " + playerPoint + " Comuter: " + computerPoint;
        pointElement.innerHTML = showPoints;
      }
    </script>
  </body>
</html>
