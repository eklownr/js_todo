<!DOCTYPE html>
<html>
  <head>
    <title>functions</title>
  </head>
  <body>
    <h2>Play rock, paper, scissors</h1>
    <button onclick="play('rock');" class="move-button1">rock</button>
    <button onclick="play('paper');" class="move-button2">paper</button>
    <button onclick="play('scissors');" class="move-button3">scissors</button>

    <p class="result js-result">Result: </p>
    <p class="point js-point">Result: </p>


    <script>
      // globals
      let playerPoint = 0;
      let comuterPoint = 0;
    
      // play the game
      function play(playerMove) {
        const resultElement = document.querySelector('.js-result');
        const pointElement = document.querySelector('.js-point');
        computerMove = pickComputerMove();
        let res = "";
        let points = "";

        if (playerMove === computerMove) {
          res = "Tie " + "<b>You:</b> " + playerMove + " <b>Computer: </b>" + computerMove;
        } else if (
          playerMove === "rock" && computerMove === "scissors" ||
          playerMove === "scissors" && computerMove === "paper" ||
          playerMove === "paper" && computerMove === "rock") {
            res = "You win!" + "<b>You:</b> " + playerMove + " <b>Computer: <b/>" + computerMove;
            playerPoint ++;
        } else {
          res = "You lose! " + "<b>You:</b> " + playerMove + " <b>Computer: </b>" + computerMove;
          comuterPoint++;
        }

        points = "You: " + playerPoint + " Comuter: " + comuterPoint;
        resultElement.innerHTML = res;
        pointElement.innerHTML = points;
      }

      // return computer move
      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1/3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
          computerMove = 'scissors';
        }
        return computerMove;
      }

    </script>
  </body>
</html>
